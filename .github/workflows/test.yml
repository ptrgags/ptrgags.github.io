name: 'Run Unit Tests'
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use latest Node
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
      - name: Install npm packages
        run: npm ci
      - name: run unit tests
        run: npm test
      - name: run build to check for errors
        run: npm run build
